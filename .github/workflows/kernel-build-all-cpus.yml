name: Linux TKG P03 Build All CPUs

permissions:
  contents: write
  packages: write
  id-token: write

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4.2.0
      
      - name: Check for new kernel version
        id: check
        run: |
          LATEST=$(curl -s https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          echo "Latest kernel: $LATEST"
          
          if [ -f .last_kernel_version ]; then
            BUILT=$(cat .last_kernel_version)
            echo "Last built: $BUILT"
          else
            BUILT="none"
            echo "No previous build found"
          fi
          
          if [ "$LATEST" != "$BUILT" ]; then
            echo "version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "New version detected: $LATEST"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

  build-matrix:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 180
    strategy:
      matrix:
        cpu-type:
          - znver3
          - znver4
          - x86-64
          - x86-64-v3
          - x86-64-v4
          - haswell
          - skylake
          - broadwell
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.KERNEL_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            ${{ matrix.cpu-type }}-latest

      - name: Build and push ${{ matrix.cpu-type }}
        uses: docker/build-push-action@v5
        with:
          context: ./build-tools  # Context is build-tools directory
          file: ./build-tools/Dockerfile
          build-args: |
            CPU_TYPE=${{ matrix.cpu-type }}
            KERNEL_VERSION=${{ needs.check-version.outputs.new_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.cpu-type }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.cpu-type }},mode=max

      - name: Extract kernel packages from container
        run: |
          mkdir -p output-${{ matrix.cpu-type }}
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          # Copy packages from the build directory
          docker run --rm \
            -v $(pwd)/output-${{ matrix.cpu-type }}:/output \
            --entrypoint /bin/bash \
            ${IMAGE_NAME_LOWER}:${{ matrix.cpu-type }}-latest \
            -c "cp /linux-tkg/*.pkg.tar.* /output/ 2>/dev/null; echo 'Package list:'; ls -la /linux-tkg/*.pkg.tar.* 2>/dev/null || echo 'No packages found in /linux-tkg/'"

      - name: Generate build info
        run: |
          echo "CPU_TYPE=${{ matrix.cpu-type }}" >> build-${{ matrix.cpu-type }}.info
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> build-${{ matrix.cpu-type }}.info
          echo "GIT_SHA=${{ github.sha }}" >> build-${{ matrix.cpu-type }}.info
          echo "KERNEL_VERSION=${{ needs.check-version.outputs.new_version }}" >> build-${{ matrix.cpu-type }}.info
          echo "PACKAGES=$(ls -1 output-${{ matrix.cpu-type }}/*.pkg.tar.* 2>/dev/null | wc -l)" >> build-${{ matrix.cpu-type }}.info

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.cpu-type }}
          path: output-${{ matrix.cpu-type }}/*.pkg.tar.*
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.cpu-type }}
          path: build-${{ matrix.cpu-type }}.info
          retention-days: 30

  create-release:
    needs: [check-version, build-matrix]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          body: |
            # Linux TKG P03 v${{ needs.check-version.outputs.new_version }}
            
            This release contains optimized kernels for the following CPU architectures:
            - AMD Zen3, Zen4
            - Generic (x86-64, v3, v4)
            - Intel Haswell, Skylake, Broadwell
            
            Each variant is built with architecture-specific optimizations for maximum performance.
            
            Build Info:
            - Kernel Version: ${{ needs.check-version.outputs.new_version }}
            - Build Date: ${{ github.event.head_commit.timestamp }}
            - Git SHA: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-version:
    needs: [check-version, build-matrix]
    if: needs.check-version.outputs.should_build == 'true' && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      
      - name: Update version file
        run: |
          echo "${{ needs.check-version.outputs.new_version }}" > .last_kernel_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_kernel_version
          git commit -m "Update: kernel ${{ needs.check-version.outputs.new_version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

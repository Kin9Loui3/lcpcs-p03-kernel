name: Build Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cpu_type:
        description: 'CPU Type'
        required: true
        default: 'generic'
        type: choice
        options:
          - generic
          - zen
          - zen2
          - zen3

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu_type: [generic, zen, zen2, zen3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel in container
        run: |
          docker build \
            --build-arg CPU_TYPE=${{ matrix.cpu_type }} \
            -t kernel-builder:${{ matrix.cpu_type }} \
            .
          docker run --rm \
            -v ${{ github.workspace }}:/output \
            kernel-builder:${{ matrix.cpu_type }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.cpu_type }}
          path: kernel-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: kernel-*/kernel-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

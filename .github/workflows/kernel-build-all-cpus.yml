name: Linux TKG P03 Build All CPUs

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-kernel-update:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      new_version: ${{ steps.check.outputs.new_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Check kernel version
        id: check
        run: |
          CURRENT=$(curl -s https://www.kernel.org/releases.json | jq -r '.releases[0].version')
          LATEST=$(cat VERSION 2>/dev/null || echo "0.0.0")
          
          echo "current_version=$LATEST" >> $GITHUB_OUTPUT
          echo "new_version=$CURRENT" >> $GITHUB_OUTPUT
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "✓ New kernel available: $CURRENT (current: $LATEST)"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✓ Already on latest: $CURRENT"
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [generic, native, zen, zen2, zen3, zen4, generic-v2, generic-v3, generic-v4]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            base-devel \
            git \
            gcc \
            make \
            libelf-dev \
            libssl-dev \
            bison \
            flex \
            clang \
            lld \
            llvm \
            pahole \
            dwarves \
            fakeroot \
            devscripts \
            build-essential

      - name: Clone linux-tkg
        run: |
          git clone https://github.com/Frogging-Family/linux-tkg.git
          cd linux-tkg
          git log --oneline -1

      - name: Set CPU optimization - ${{ matrix.cpu }}
        working-directory: linux-tkg
        run: |
          sed -i 's/_cpusched=.*/_cpusched=${{ matrix.cpu }}/' customization.cfg

      - name: Build kernel - ${{ matrix.cpu }}
        working-directory: linux-tkg
        run: |
          chmod +x makepkg
          makepkg -s --noconfirm 2>&1 | tee build-${{ matrix.cpu }}.log

      - name: Generate checksums
        working-directory: linux-tkg
        run: |
          sha256sum *.pkg.tar.zst > checksums-${{ matrix.cpu }}.txt
          cat checksums-${{ matrix.cpu }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.cpu }}
          path: |
            linux-tkg/*.pkg.tar.zst
            linux-tkg/checksums-${{ matrix.cpu }}.txt
            linux-tkg/build-${{ matrix.cpu }}.log
          retention-days: 30

  verify:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Verify all builds
        run: |
          echo "=== Build Verification ==="
          for dir in kernel-*/; do
            cpu=$(echo "$dir" | sed 's/kernel-//;s/\///')
            echo "✓ $cpu:"
            ls -lh "$dir"/*.pkg.tar.zst 2>/dev/null | awk '{print "  " $9 " (" $5 ")"}'
            cat "$dir"/checksums-*.txt 2>/dev/null || echo "  No checksums found"
          done
          echo ""
          echo "Total packages: $(find . -name '*.pkg.tar.zst' | wc -l)"

  release:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: kernel-*/*.pkg.tar.zst
          body: |
            Linux TKG P03 Kernel Build
            Built for: generic, native, zen, zen2, zen3, zen4, generic-v2, generic-v3, generic-v4
            Verify checksums before installing!

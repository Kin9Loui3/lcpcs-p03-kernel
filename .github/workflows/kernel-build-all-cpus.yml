name: Build Arch Kernel on Ubuntu

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [zen3, zen4, x86-64-v3, x86-64-v4]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            base-devel \
            git \
            fakeroot \
            binutils \
            gcc \
            make \
            patch \
            libelf-dev \
            libssl-dev \
            bison \
            flex \
            bc \
            kmod \
            cpio \
            pahole \
            zstd \
            wget \
            curl

      - name: Install AUR helper (yay)
        run: |
          sudo apt-get install -y cargo rustc
          git clone https://aur.archlinux.org/yay.git
          cd yay
          makepkg -si --noconfirm || true
          cd ..

      - name: Create non-root build user
        run: |
          sudo useradd -m -s /bin/bash builder || true
          sudo usermod -aG sudo builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/builder

      - name: Download kernel source
        run: |
          mkdir -p /tmp/kernel-build
          cd /tmp/kernel-build
          KERNEL_VERSION=$(curl -s https://www.kernel.org/releases.json | grep -oP '"latest_stable":\{"version":"[^"]+' | cut -d'"' -f4)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          wget https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz
          tar -xf linux-${KERNEL_VERSION}.tar.xz
          cd linux-${KERNEL_VERSION}

      - name: Create PKGBUILD
        run: |
          mkdir -p /tmp/kernel-build/pkgbuild
          cd /tmp/kernel-build/pkgbuild
          cat > PKGBUILD << 'PKGBUILD_EOF'
          pkgbase=linux-lcpcs-p03
          pkgname=(linux-lcpcs-p03 linux-lcpcs-p03-headers)
          pkgver=KERNEL_VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="Linux kernel - LCPCs P03 optimized for CPU_PLACEHOLDER"
          arch=(x86_64)
          url="https://www.kernel.org/"
          license=(GPL2)
          makedepends=(
            bc kmod libelf pahole cpio perl tar xz
            gcc binutils make patch libelf-dev libssl-dev bison flex
          )
          options=(!strip)
          source=(
            "https://cdn.kernel.org/pub/linux/kernel/v${pkgver%%.*}.x/linux-${pkgver}.tar.xz"
            "config"
          )
          
          _kernver="${pkgver}-lcpcs-p03-CPU_PLACEHOLDER"
          
          prepare() {
            cd linux-${pkgver}
            
            # Apply custom config
            cp ../config .config
            
            # Set CPU optimization
            case "CPU_PLACEHOLDER" in
              zen3)
                scripts/config --set-str CONFIG_GENERIC_CPU "Zen 3"
                scripts/config --enable CONFIG_GENERIC_CPU3
                ;;
              zen4)
                scripts/config --set-str CONFIG_GENERIC_CPU "Zen 4"
                scripts/config --enable CONFIG_GENERIC_CPU4
                ;;
              x86-64-v3)
                scripts/config --set-str CONFIG_GENERIC_CPU "x86-64-v3"
                ;;
              x86-64-v4)
                scripts/config --set-str CONFIG_GENERIC_CPU "x86-64-v4"
                ;;
            esac
            
            # Optimize for performance
            scripts/config --disable CONFIG_DEBUG_INFO
            scripts/config --disable CONFIG_DEBUG_KERNEL
            scripts/config --enable CONFIG_LOCALVERSION_AUTO
            scripts/config -s LOCALVERSION "-lcpcs-p03-CPU_PLACEHOLDER"
            
            # Make olddefconfig
            make olddefconfig
          }
          
          build() {
            cd linux-${pkgver}
            make all -j$(nproc)
          }
          
          package_linux-lcpcs-p03() {
            pkgdesc="Linux kernel - LCPCs P03 optimized"
            depends=(cpio kmod initramfs)
            optdepends=('wireless-regdb: to set the correct wireless regulator domain')
            provides=(VIRTUALKERNEL="${pkgver}")
            
            cd linux-${pkgver}
            
            # Install modules
            mkdir -p "$pkgdir/usr/lib/modules/${_kernver}"
            make INSTALL_MOD_PATH="$pkgdir/usr" INSTALL_MOD_STRIP=1 modules_install
            
            # Install kernel image
            mkdir -p "$pkgdir/boot"
            install -Dm644 arch/x86/boot/bzImage "$pkgdir/boot/vmlinuz-${_kernver}"
            install -Dm644 System.map "$pkgdir/boot/System.map-${_kernver}"
            install -Dm644 .config "$pkgdir/boot/config-${_kernver}"
            
            # Remove unnecessary files
            rm -rf "$pkgdir/usr/lib/modules/${_kernver}/build"
            rm -rf "$pkgdir/usr/lib/modules/${_kernver}/source"
        
            # Install mkinitcpio preset
            mkdir -p "$pkgdir/etc/mkinitcpio.d"
            cat > "$pkgdir/etc/mkinitcpio.d/${pkgbase}.preset" << EOF
            
# mkinitcpio preset file for the '${pkgbase}' package

ALL_config="/etc/mkinitcpio.conf"
ALL_kver="/boot/vmlinuz-${_kernver}"
ALL_microcode=(/boot/*-ucode.img)

PRESETS=('default' 'fallback')

default_image="/boot/initramfs-${_kernver}.img"
default_options="-v"

fallback_image="/boot/initramfs-${_kernver}-fallback.img"
fallback_options="-S autodetect"
EOF
          }
          
          package_linux-lcpcs-p03-headers() {
            pkgdesc="Headers and scripts for building modules for the ${pkgbase} kernel"
            depends=(pahole)
            
            cd linux-${pkgver}
            
            mkdir -p "$pkgdir/usr/lib/modules/${_kernver}"
            
            # Install headers
            cp -t "$pkgdir/usr/lib/modules/${_kernver}/build" -a include scripts
            
            # Install Makefile and Kconfig
            install -Dm644 Makefile "$pkgdir/usr/lib/modules/${_kernver}/build/Makefile"
            install -Dm644 kernel/Makefile "$pkgdir/usr/lib/modules/${_kernver}/build/kernel/Makefile"
            install -Dm644 .config "$pkgdir/usr/lib/modules/${_kernver}/build/.config"
            
            # Copy arch files
            mkdir -p "$pkgdir/usr/lib/modules/${_kernver}/build/arch/x86"
            cp -t "$pkgdir/usr/lib/modules/${_kernver}/build/arch/x86" -a arch/x86/include arch/x86/Makefile*
            
            # Install tools
            mkdir -p "$pkgdir/usr/lib/modules/${_kernver}/build/tools/objtool"
            cp -t "$pkgdir/usr/lib/modules/${_kernver}/build/tools/objtool" -a tools/objtool/objtool
            
            # Remove unnecessary files
            find "$pkgdir/usr/lib/modules/${_kernver}/build" -name "*.o" -delete
            find "$pkgdir/usr/lib/modules/${_kernver}/build" -name "*.a" -delete
            
            # Create symlink
            mkdir -p "$pkgdir/usr/lib/modules/${_kernver}"
            ln -sr "$pkgdir/usr/lib/modules/${_kernver}/build" "$pkgdir/usr/lib/modules/${_kernver}/source"
          }
          PKGBUILD_EOF

      - name: Generate default config
        run: |
          cd /tmp/kernel-build/linux-${KERNEL_VERSION}
          make defconfig
          cp .config /tmp/kernel-build/pkgbuild/config

      - name: Build kernel package
        run: |
          cd /tmp/kernel-build/pkgbuild
          
          # Replace placeholders
          sed -i "s/KERNEL_VERSION_PLACEHOLDER/${KERNEL_VERSION}/g" PKGBUILD
          sed -i "s/CPU_PLACEHOLDER/${{ matrix.cpu }}/g" PKGBUILD
          
          # Build as non-root (optional, for security)
          # sudo -u builder makepkg -s --noconfirm
          
          # Or build as root (faster)
          makepkg -s --noconfirm

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-${{ matrix.cpu }}
          path: /tmp/kernel-build/pkgbuild/*.pkg.tar.zst
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/kernel-build/pkgbuild/*.pkg.tar.zst
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd /tmp/kernel-build/pkgbuild
          sha256sum *.pkg.tar.zst > SHA256SUMS
          echo "## SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: Linux TKG P03 Build All CPUs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [generic, zen4, zen5]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            ccache \
            libncurses-dev \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3 \
            pahole \
            bc \
            cpio \
            rsync \
            tar \
            gzip \
            xz-utils

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.cpu }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.cpu }}-
            ccache-

      - name: Initialize ccache
        run: |
          ccache -z
          ccache -s

      - name: Download Linux kernel source
        run: |
          cd build-tools/linux-tkg
          if [ ! -f linux-*.tar.xz ]; then
            echo "Downloading kernel source..."
            wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.13.tar.xz
            tar -xf linux-6.13.tar.xz
            mv linux-6.13 linux-src
          fi

      - name: Apply TKG patches
        run: |
          cd build-tools/linux-tkg/linux-src
          
          echo "Applying TKG patches for ${{ matrix.cpu }}..."
          
          # Apply base patches
          for patch in ../patches/base/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $(basename $patch)..."
              patch -p1 < "$patch" || echo "Warning: $(basename $patch) may have conflicts"
            fi
          done
          
          # Apply CPU-specific patches
          if [ -d "../patches/${{ matrix.cpu }}" ]; then
            for patch in ../patches/${{ matrix.cpu }}/*.patch; do
              if [ -f "$patch" ]; then
                echo "Applying $(basename $patch)..."
                patch -p1 < "$patch" || echo "Warning: $(basename $patch) may have conflicts"
              fi
            done
          fi
          
          echo "✓ Patches applied for ${{ matrix.cpu }}"

      - name: Configure kernel
        run: |
          cd build-tools/linux-tkg/linux-src
          
          echo "Configuring kernel for ${{ matrix.cpu }}..."
          
          # Copy config
          if [ -f "../configs/${{ matrix.cpu }}.config" ]; then
            cp ../configs/${{ matrix.cpu }}.config .config
          else
            make defconfig
          fi
          
          # Set CPU-specific options
          case "${{ matrix.cpu }}" in
            zen4)
              ./scripts/config --set-str CONFIG_GENERIC_CPU "n"
              ./scripts/config --set-str CONFIG_MZEN4 "y"
              ;;
            zen5)
              ./scripts/config --set-str CONFIG_GENERIC_CPU "n"
              ./scripts/config --set-str CONFIG_MZEN5 "y"
              ;;
            generic)
              ./scripts/config --set-str CONFIG_GENERIC_CPU "y"
              ;;
          esac
          
          # Enable common optimizations
          ./scripts/config --enable CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
          ./scripts/config --enable CONFIG_HAVE_EFFICIENT_UNALIGNED_ACCESS
          ./scripts/config --set-str CONFIG_TUNE_CPU "${{ matrix.cpu }}"
          
          make olddefconfig
          echo "✓ Kernel configured for ${{ matrix.cpu }}"

      - name: Build kernel
        run: |
          cd build-tools/linux-tkg/linux-src
          
          echo "Building kernel for ${{ matrix.cpu }}..."
          
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          # Build with parallel jobs
          make -j$(nproc) \
            ARCH=x86_64 \
            LOCALVERSION=-tkg-p03-${{ matrix.cpu }} \
            2>&1 | tail -50
          
          if [ $? -eq 0 ]; then
            echo "✓ Kernel build successful for ${{ matrix.cpu }}"
          else
            echo "✗ Kernel build failed for ${{ matrix.cpu }}"
            exit 1
          fi

      - name: Build modules
        run: |
          cd build-tools/linux-tkg/linux-src
          
          echo "Building modules for ${{ matrix.cpu }}..."
          
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          make modules -j$(nproc) \
            ARCH=x86_64 \
            LOCALVERSION=-tkg-p03-${{ matrix.cpu }} \
            2>&1 | tail -30
          
          if [ $? -eq 0 ]; then
            echo "✓ Modules build successful for ${{ matrix.cpu }}"
          else
            echo "✗ Modules build failed for ${{ matrix.cpu }}"
            exit 1
          fi

      - name: Create build output directory
        run: |
          mkdir -p build-tools/linux-tkg/output/${{ matrix.cpu }}
          echo "✓ Output directory created"

      - name: Copy kernel and modules
        run: |
          cd build-tools/linux-tkg/linux-src
          
          echo "Copying build artifacts for ${{ matrix.cpu }}..."
          
          # Copy kernel image
          if [ -f "arch/x86_64/boot/bzImage" ]; then
            cp arch/x86_64/boot/bzImage ../output/${{ matrix.cpu }}/vmlinuz-tkg-p03-${{ matrix.cpu }}
            echo "✓ Kernel image copied"
          fi
          
          # Copy System.map
          if [ -f "System.map" ]; then
            cp System.map ../output/${{ matrix.cpu }}/System.map-tkg-p03-${{ matrix.cpu }}
            echo "✓ System.map copied"
          fi
          
          # Copy .config
          if [ -f ".config" ]; then
            cp .config ../output/${{ matrix.cpu }}/config-tkg-p03-${{ matrix.cpu }}
            echo "✓ Config copied"
          fi
          
          # Create modules tarball
          echo "Creating modules archive..."
          tar -czf ../output/${{ matrix.cpu }}/modules-tkg-p03-${{ matrix.cpu }}.tar.gz \
            lib/modules/*/kernel 2>/dev/null || echo "Note: Some module paths may not exist"
          echo "✓ Modules archived"

      - name: Rename packages with CPU variant
        run: |
          cd build-tools/linux-tkg/output/${{ matrix.cpu }}
          
          echo "Renaming packages for ${{ matrix.cpu }}..."
          
          for file in *; do
            if [[ "$file" == *"tkg-p03"* ]]; then
              newname="${file/tkg-p03/tkg-p03-${{ matrix.cpu }}}"
              if [ "$file" != "$newname" ]; then
                mv "$file" "$newname"
                echo "  Renamed: $file → $newname"
              fi
            fi
          done
          
          echo "✓ Packages renamed with CPU variant"

      - name: Generate checksums
        run: |
          cd build-tools/linux-tkg/output/${{ matrix.cpu }}
          
          echo "Generating checksums for ${{ matrix.cpu }}..."
          
          sha256sum * > SHA256SUMS-tkg-p03-${{ matrix.cpu }}.txt
          
          echo "✓ Checksums generated"
          echo "Checksums:"
          cat SHA256SUMS-tkg-p03-${{ matrix.cpu }}.txt

      - name: Display build statistics
        run: |
          cd build-tools/linux-tkg/output/${{ matrix.cpu }}
          
          echo "Build Statistics for ${{ matrix.cpu }}:"
          echo "======================================"
          ls -lh
          echo ""
          echo "Total size:"
          du -sh .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tkg-p03-${{ matrix.cpu }}
          path: build-tools/linux-tkg/output/${{ matrix.cpu }}/
          retention-days: 30

      - name: Print ccache statistics
        run: |
          ccache -s
          echo "✓ Build completed for ${{ matrix.cpu }}"

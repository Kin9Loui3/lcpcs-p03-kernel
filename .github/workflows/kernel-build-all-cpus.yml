name: Linux TKG P03 Build All CPUs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

env:
  KERNEL_VERSION: "6.13.5"
  BUILDER_REPO: "sirlucjan/kernel-patches"
  BUILDER_REF: "master"
  KERNEL_REPO: "sirlucjan/linux-tkg"
  KERNEL_REF: "master"

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout builder repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.BUILDER_REPO }}
        ref: ${{ env.BUILDER_REF }}

    - name: Download kernel source
      run: |
        cd linux-tkg
        ./download_kernel_source.sh ${{ env.KERNEL_VERSION }}

    - name: Configure build
      run: |
        cd linux-tkg
        echo "_diff_cpuspecs=" > customization.cfg
        echo "_cpusched=" > customization.cfg
        echo "_compiler="gcc"" > customization.cfg
        echo "_processor_opt=${{ matrix.cpu }}" >> customization.cfg
        echo "_config_processor_override=1" >> customization.cfg
        echo "_localmodcfg=" >> customization.cfg
        echo "_menucfg=" >> customization.cfg
        echo "_numadisable=2" >> customization.cfg

    - name: Build kernel
      run: |
        cd linux-tkg
        ./install.sh install

    - name: Upload kernel packages
      uses: actions/upload-artifact@v4
      with:
        name: kernel-packages-${{ matrix.cpu }}
        path: linux-tkg/*.pkg.tar.zst
        retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
        name: "Linux TKG ${{ env.KERNEL_VERSION }} Kernel Build ${{ github.run_number }}"
        body: |
          ## Linux TKG Kernel ${{ env.KERNEL_VERSION }}
          Auto-built from ${{ env.BUILDER_REPO }}@${{ env.BUILDER_REF }}
          
          ### CPU Optimizations:
          - znver3 (AMD Zen 3)
          - znver4 (AMD Zen 4)
          - x86-64 (Generic)
          - x86-64-v3 (Haswell/Broadwell/Skylake)
          - x86-64-v4 (AVX512)
          - haswell (Intel Haswell)
          - skylake (Intel Skylake)
          - broadwell (Intel Broadwell)
          
          ### Build Info:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

  update-version:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Save version
      run: |
        echo "${{ env.KERNEL_VERSION }}" > .last_kernel_version
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .last_kernel_version
        git commit -m "Update last kernel version to ${{ env.KERNEL_VERSION }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

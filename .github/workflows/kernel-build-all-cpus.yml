runs-on: ubuntu-latest
timeout-minutes: 180

steps:
- name: Checkout repository
  uses: actions/checkout@v4
  with:
    fetch-depth: 1

- name: Install build dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      build-essential \
      bc \
      bison \
      flex \
      libssl-dev \
      libelf-dev \
      xz-utils \
      zstd \
      cpio \
      dwarves \
      pahole \
      kmod \
      rsync \
      git \
      wget \
      curl

- name: Get latest kernel 7.x version
  id: kernel_version
  run: |
    echo "Fetching latest kernel 7.x version..."
    
    # Get the latest stable kernel from kernel.org
    LATEST=$(curl -s https://www.kernel.org/releases.json | grep -oP '"latest_stable":\s*"\K[^"]+')
    echo "Latest stable kernel: $LATEST"
    
    # Extract major version
    MAJOR_VERSION=$(echo "$LATEST" | cut -d'.' -f1)
    echo "Major version: $MAJOR_VERSION"
    
    # Check if it's 7.x or higher
    if [ "$MAJOR_VERSION" -ge 7 ]; then
      KERNEL_VERSION="$LATEST"
      echo "Using latest kernel: $KERNEL_VERSION"
    else
      # If latest is not 7.x, try to find the latest 7.x
      echo "Latest is not 7.x, searching for latest 7.x..."
      
      # Try common 7.x versions
      for ver in 7.12 7.11 7.10 7.9 7.8 7.7 7.6 7.5 7.4 7.3 7.2 7.1; do
        if wget --spider -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${ver}.tar.xz" 2>/dev/null; then
          KERNEL_VERSION="$ver"
          echo "Found kernel 7.x: $KERNEL_VERSION"
          break
        fi
      done
    fi
    
    # Fallback
    if [ -z "$KERNEL_VERSION" ]; then
      KERNEL_VERSION="7.1"
      echo "Using fallback kernel: $KERNEL_VERSION"
    fi
    
    echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
    echo "Final kernel version: $KERNEL_VERSION"

- name: Download kernel 7.x source
  run: |
    KERNEL_VERSION="${{ steps.kernel_version.outputs.version }}"
    echo "Downloading kernel version: $KERNEL_VERSION"
    
    # Download from v7.x directory
    echo "Downloading from v7.x..."
    if wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.tar.xz"; then
      echo "Successfully downloaded linux-${KERNEL_VERSION}.tar.xz"
    else
      # Try with .0 appended
      echo "Trying with .0 appended..."
      if wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.0.tar.xz"; then
        KERNEL_VERSION="${KERNEL_VERSION}.0"
        echo "Successfully downloaded linux-${KERNEL_VERSION}.tar.xz"
      else
        echo "ERROR: Failed to download kernel source"
        echo "Available kernels:"
        curl -s https://cdn.kernel.org/pub/linux/kernel/v7.x/ | grep -oP 'linux-\d+\.\d+(\.\d+)?\.tar\.xz' | sort -V | tail -10
        exit 1
      fi
    fi
    
    tar -xf "linux-${KERNEL_VERSION}.tar.xz"
    mv "linux-${KERNEL_VERSION}" linux-tkg
    echo "Kernel source extracted to linux-tkg"

- name: Apply patches from repository
  run: |
    cd linux-tkg
    
    # Apply all patches from the patches directory
    PATCH_DIR="${{ github.workspace }}/build-tools/linux-tkg-p03/patches"
    if [ -d "$PATCH_DIR" ]; then
      # Sort patches to apply them in order
      patch_count=0
      for patch in $(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
        if [ -f "$patch" ]; then
          echo "Applying patch: $(basename $patch)"
          if patch -p1 < "$patch"; then
            patch_count=$((patch_count + 1))
          else
            echo "Warning: $(basename $patch) failed to apply"
          fi
        fi
      done
      echo "Applied $patch_count patches successfully"
    else
      echo "No patches directory found at $PATCH_DIR"
      mkdir -p "$PATCH_DIR"
    fi

- name: Configure kernel
  run: |
    cd linux-tkg
    
    # Copy existing config if available
    if [ -f "${{ github.workspace }}/build-tools/linux-tkg-p03/config" ]; then
      cp "${{ github.workspace }}/build-tools/linux-tkg-p03/config" .config
      echo "Using existing config file"
    else
      # Generate default config
      make defconfig
      echo "Generated default config"
    fi
    
    # Apply CPU optimization
    CPU_OPT="${{ matrix.cpu }}"
    echo "Applying CPU optimization: $CPU_OPT"
    
    # Enable specific CPU optimizations
    case "$CPU_OPT" in
      znver3)
        scripts/config --set-val CONFIG_MZEN3 y
        ;;
      znver4)
        scripts/config --set-val CONFIG_MZEN4 y
        ;;
      x86-64-v3)
        scripts/config --set-val CONFIG_MX86_64_V3 y
        ;;
      x86-64-v4)
        scripts/config --set-val CONFIG_MX86_64_V4 y
        ;;
      haswell)
        scripts/config --set-val CONFIG_MHASWELL y
        ;;
      skylake)
        scripts/config --set-val CONFIG_MSKYLAKE y
        ;;
      broadwell)
        scripts/config --set-val CONFIG_MBROADWELL y
        ;;
    esac
    
    # Disable debug options for faster build
    scripts/config --disable DEBUG_INFO
    scripts/config --disable DEBUG_KERNEL
    
    # Set kernel compression to zstd
    scripts/config --set-val CONFIG_KERNEL_ZSTD y
    
    echo "Configuration complete for $CPU_OPT"

- name: Build kernel
  run: |
    cd linux-tkg
    
    # Get number of CPU cores
    CORES=$(nproc)
    echo "Building with $CORES cores"
    
    # Build kernel and modules
    make -j$CORES bzImage
    make -j$CORES modules
    
    echo "Build complete for ${{ matrix.cpu }}"

- name: Package kernel
  run: |
    cd linux-tkg
    
    # Create output directory
    OUTPUT_DIR="${{ github.workspace }}/kernel-output/${{ matrix.cpu }}"
    mkdir -p "$OUTPUT_DIR"
    
    # Install modules
    make modules_install INSTALL_MOD_PATH="$OUTPUT_DIR"
    
    # Copy kernel image
    cp arch/x86/boot/bzImage "$OUTPUT_DIR/vmlinuz-${{ matrix.cpu }}"
    
    # Copy System.map
    cp System.map "$OUTPUT_DIR/System.map-${{ matrix.cpu }}"
    
    # Copy config
    cp .config "$OUTPUT_DIR/config-${{ matrix.cpu }}"
    
    echo "Packaged kernel for ${{ matrix.cpu }}"

- name: Upload kernel artifacts
  uses: actions/upload-artifact@v4
  with:
    name: kernel-${{ matrix.cpu }}
    path: kernel-output/${{ matrix.cpu }}/
    retention-days: 30

- name: Upload combined artifacts
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: all-kernels
    path: kernel-output/
    retention-days: 30

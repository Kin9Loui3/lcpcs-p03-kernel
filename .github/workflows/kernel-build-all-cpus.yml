name: Linux TKG P03 Build All CPUs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu-type:
          - zen3
          - zen4
          - zen4c
          - generic
          - generic-v3
          - generic-v4
          - intel-haswell
          - intel-skylake
          - intel-broadwell
      fail-fast: false

    steps:
      - uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            ${{ matrix.cpu-type }}-latest

      - name: Build and push ${{ matrix.cpu-type }}
        uses: docker/build-push-action@v5
        with:
          context: ./build-tools
          file: ./build-tools/Dockerfile
          build-args: |
            CPU_TYPE=${{ matrix.cpu-type }}
            _processor_opt=${{ matrix.cpu-type }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build info
        run: |
          echo "CPU_TYPE=${{ matrix.cpu-type }}" >> build-${{ matrix.cpu-type }}.info
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> build-${{ matrix.cpu-type }}.info
          echo "GIT_SHA=${{ github.sha }}" >> build-${{ matrix.cpu-type }}.info

      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.cpu-type }}
          path: build-${{ matrix.cpu-type }}.info
          retention-days: 30

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4.2.0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release with build info
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: artifacts/**/*
          body: |
            # Linux TKG P03 - Multi-CPU Build Release
            
            This release contains optimized kernels for the following CPU architectures:
            - AMD Zen3, Zen4, Zen4C
            - Generic (x86-64, v3, v4)
            - Intel Haswell, Skylake, Broadwell
            
            Each variant is built with architecture-specific optimizations for maximum performance.

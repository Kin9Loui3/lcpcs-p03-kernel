name: Linux TKG P03 Build All CPUs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

env:
  TKG_REPO: "sirlucjan/kernel-patches"
  TKG_REF: "master"

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    # Step 1: Checkout YOUR repo (contains your patches and this workflow)
    - name: Checkout your repo with patches
      uses: actions/checkout@v4
      with:
        path: my-repo

    # Step 2: Checkout TKG builder repo
    - name: Checkout TKG builder repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.TKG_REPO }}
        ref: ${{ env.TKG_REF }}
        path: builder

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          xz-utils \
          zstd \
          git \
          curl \
          wget \
          cpio \
          dwarves \
          python3 \
          python3-pip \
          pahole \
          xmlto \
          docbook-utils \
          gcc \
          make \
          automake \
          autoconf \
          libtool \
          kmod

    - name: Download kernel source and setup TKG build
      run: |
        cd builder
        
        # Copy your customization.cfg to the builder root
        cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/customization.cfg .
        
        # Copy your patches to the builder's patches directory
        mkdir -p patches/custom
        cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/patches/*.patch patches/custom/
        
        # Also copy p03.config if it exists
        if [ -f "${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/p03.config" ]; then
          cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/p03.config .
        fi
        
        echo "Directory structure:"
        ls -la

    - name: Run TKG build script
      run: |
        cd builder
        
        # Make sure the build script is executable
        chmod +x build.sh 2>/dev/null || true
        
        # Run the TKG build script with your customization.cfg
        # The script will automatically download the correct kernel version (7.1-latest)
        # and apply all patches including yours
        if [ -f "build.sh" ]; then
          # Set environment variables for non-interactive build
          export _noconfirm=1
          export _distro="Arch"
          export _kernel_config="$(pwd)/customization.cfg"
          
          # Run the build script
          bash build.sh
        else
          echo "No build.sh found in TKG repo root"
          ls -la
          exit 1
        fi

    - name: Upload kernel packages
      uses: actions/upload-artifact@v4
      with:
        name: kernel-packages-${{ matrix.cpu }}
        path: |
          builder/linux-tkg/*.pkg.tar.zst
          builder/linux-tkg/arch/x86/boot/bzImage
          builder/linux-tkg/vmlinux
        retention-days: 7
        if-no-files-found: warn

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v7.1-${{ github.run_number }}
        name: "Linux TKG 7.1 Kernel Build ${{ github.run_number }}"
        body: |
          ## Linux TKG Kernel 7.1 (P03)
          Auto-built with custom P03 patches
          
          ### CPU Optimizations:
          - znver3 (AMD Zen 3)
          - znver4 (AMD Zen 4)
          - x86-64 (Generic)
          - x86-64-v3 (Haswell/Broadwell/Skylake)
          - x86-64-v4 (AVX512)
          - haswell (Intel Haswell)
          - skylake (Intel Skylake)
          - broadwell (Intel Broadwell)
          
          ### Patches Applied:
          - 750hz, acpi-call, IBT support
          - BBR3, BORE scheduler
          - cgroup-vram, clang-polly
          - Various fixes and optimizations
          - OpenRGB, vhba support
          
          ### Build Info:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

  update-version:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Save version
      run: |
        echo "7.1-latest" > .last_kernel_version
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .last_kernel_version
        git commit -m "Update last kernel version to 7.1-latest"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

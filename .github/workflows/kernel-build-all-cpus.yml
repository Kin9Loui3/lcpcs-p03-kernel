name: Linux Kernel P03 Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false
    
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          xz-utils \
          zstd \
          cpio \
          dwarves \
          pahole \
          kmod \
          rsync
    
    - name: Get kernel version from config
      id: kernel_version
      run: |
        VERSION=$(grep '_version=' build-tools/linux-tkg-p03/customization.cfg | head -1 | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building kernel version: $VERSION"
    
    - name: Download kernel source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ steps.kernel_version.outputs.version }}.tar.xz
        tar -xf linux-${{ steps.kernel_version.outputs.version }}.tar.xz
        mv linux-${{ steps.kernel_version.outputs.version }} linux-tkg
    
    - name: Apply patches from repository
      run: |
        cd linux-tkg
        
        # Apply all patches from the patches directory
        PATCH_DIR=${{ github.workspace }}/build-tools/linux-tkg-p03/patches
        if [ -d "$PATCH_DIR" ]; then
          for patch in "$PATCH_DIR"/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying patch: $(basename $patch)"
              patch -p1 < "$patch" || echo "Warning: $(basename $patch) failed to apply"
            fi
          done
        fi
        
        # Copy the config if it exists
        if [ -f "${{ github.workspace }}/build-tools/linux-tkg-p03/p03.config" ]; then
          echo "Using custom p03.config"
          cp ${{ github.workspace }}/build-tools/linux-tkg-p03/p03.config .config
        fi
    
    - name: Configure kernel for ${{ matrix.cpu }}
      run: |
        cd linux-tkg
        
        # If we don't have a config yet, use defconfig
        if [ ! -f .config ]; then
          make defconfig
        fi
        
        # Set CPU optimization
        CPU_OPT="${{ matrix.cpu }}"
        scripts/config --disable CONFIG_GENERIC_CPU
        scripts/config --disable CONFIG_MCORE2
        scripts/config --disable CONFIG_MATOM
        scripts/config --disable CONFIG_MZEN_V2
        scripts/config --disable CONFIG_MZEN_V3
        scripts/config --disable CONFIG_MZEN_V4
        scripts/config --disable CONFIG_GENERIC_CPU2
        scripts/config --disable CONFIG_GENERIC_CPU3
        scripts/config --disable CONFIG_MHASWELL
        scripts/config --disable CONFIG_MSKYLAKE
        scripts/config --disable CONFIG_MBROADWELL
        
        case $CPU_OPT in
          znver3)
            scripts/config --enable CONFIG_MZEN_V3
            ;;
          znver4)
            scripts/config --enable CONFIG_MZEN_V4
            ;;
          x86-64-v3)
            scripts/config --enable CONFIG_GENERIC_CPU2
            ;;
          x86-64-v4)
            scripts/config --enable CONFIG_GENERIC_CPU3
            ;;
          haswell)
            scripts/config --enable CONFIG_MHASWELL
            ;;
          skylake)
            scripts/config --enable CONFIG_MSKYLAKE
            ;;
          broadwell)
            scripts/config --enable CONFIG_MBROADWELL
            ;;
        esac
        
        # Finalize configuration
        make olddefconfig
        
        echo "CPU configuration:"
        grep -E "CONFIG_(MZEN_V[234]|GENERIC_CPU|MHASWELL|MSKYLAKE|MBROADWELL)" .config
    
    - name: Build kernel
      run: |
        cd linux-tkg
        make -j$(nproc) bzImage
        make -j$(nproc) modules
        echo "Build completed for ${{ matrix.cpu }}"
    
    - name: Package kernel
      run: |
        cd linux-tkg
        
        # Create package structure
        mkdir -p package/boot
        mkdir -p package/lib/modules
        
        # Copy kernel image
        cp arch/x86/boot/bzImage package/boot/vmlinuz-linux-tkg-${{ matrix.cpu }}
        
        # Install modules
        make modules_install INSTALL_MOD_PATH=package
        
        # Create compressed packages
        cd package
        tar -czf ../linux-tkg-${{ matrix.cpu }}.tar.gz *
        tar -cf ../linux-tkg-${{ matrix.cpu }}.tar *
        zstd --compress -f ../linux-tkg-${{ matrix.cpu }}.tar -o ../linux-tkg-${{ matrix.cpu }}.tar.zst
        rm -f ../linux-tkg-${{ matrix.cpu }}.tar
        
        cd ..
        echo "Packages created for ${{ matrix.cpu }}"
    
    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-tkg-${{ matrix.cpu }}
        path: |
          linux-tkg/linux-tkg-${{ matrix.cpu }}.tar.gz
          linux-tkg/linux-tkg-${{ matrix.cpu }}.tar.zst
        retention-days: 7
        if-no-files-found: warn

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: kernel-build-${{ github.run_number }}
        name: "Linux P03 Kernel Build ${{ github.run_number }}"
        body: |
          ## Linux P03 Kernel Build
          
          ### CPU Optimizations:
          - znver3 (AMD Zen 3)
          - znver4 (AMD Zen 4)
          - x86-64-v3 (Haswell/Broadwell/Skylake)
          - x86-64-v4 (AVX512)
          - haswell (Intel Haswell)
          - skylake (Intel Skylake)
          - broadwell (Intel Broadwell)
          
          ### Features:
          - Custom patches from build-tools/linux-tkg-p03
          - CPU-specific optimizations
          - Custom configuration
          
          ### Build Info:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

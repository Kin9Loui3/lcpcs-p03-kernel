name: Linux TKG P03 Build All CPUs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

env:
  KERNEL_VERSION: "6.13.5"
  BUILDER_REPO: "sirlucjan/kernel-patches"
  BUILDER_REF: "master"

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout builder repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.BUILDER_REPO }}
        ref: ${{ env.BUILDER_REF }}
        path: builder

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          xz-utils \
          zstd \
          git \
          curl \
          wget \
          cpio \
          dwarves \
          python3 \
          python3-pip \
          pahole \
          xmlto \
          docbook-utils \
          gcc \
          make \
          automake \
          autoconf \
          libtool \
          kmod

    - name: Download kernel source
      run: |
        cd builder
        # Download the kernel source
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.KERNEL_VERSION }}.tar.xz
        tar -xf linux-${{ env.KERNEL_VERSION }}.tar.xz
        mv linux-${{ env.KERNEL_VERSION }} linux-tkg

    - name: Apply TKG patches
      run: |
        cd builder
        # Copy TKG customization files
        cp customization.cfg linux-tkg/ 2>/dev/null || true
        # Apply patches if they exist
        if [ -d "linux-tkg" ]; then
          # The TKG patches are applied by the install.sh script
          echo "TKG patches will be applied during build"
        fi

    - name: Configure build
      run: |
        cd builder/linux-tkg
        cat > customization.cfg << EOF
        _diff_cpuspecs=
        _cpusched=
        _compiler="gcc"
        _processor_opt=${{ matrix.cpu }}
        _config_processor_override=1
        _localmodcfg=
        _menucfg=
        _numadisable=2
        EOF

    - name: Build kernel
      run: |
        cd builder
        chmod +x install.sh
        ./install.sh install

    - name: Upload kernel packages
      uses: actions/upload-artifact@v4
      with:
        name: kernel-packages-${{ matrix.cpu }}
        path: builder/linux-tkg/*.pkg.tar.zst
        retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
        name: "Linux TKG ${{ env.KERNEL_VERSION }} Kernel Build ${{ github.run_number }}"
        body: |
          ## Linux TKG Kernel ${{ env.KERNEL_VERSION }}
          Auto-built from ${{ env.BUILDER_REPO }}@${{ env.BUILDER_REF }}
          
          ### CPU Optimizations:
          - znver3 (AMD Zen 3)
          - znver4 (AMD Zen 4)
          - x86-64 (Generic)
          - x86-64-v3 (Haswell/Broadwell/Skylake)
          - x86-64-v4 (AVX512)
          - haswell (Intel Haswell)
          - skylake (Intel Skylake)
          - broadwell (Intel Broadwell)
          
          ### Build Info:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

  update-version:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Save version
      run: |
        echo "${{ env.KERNEL_VERSION }}" > .last_kernel_version
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .last_kernel_version
        git commit -m "Update last kernel version to ${{ env.KERNEL_VERSION }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

name: Linux TKG P03 Build All CPUs

runs-on: ubuntu-latest
timeout-minutes: 180

steps:
- name: Checkout repository
  uses: actions/checkout@v4

- name: Install dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      build-essential \
      bc \
      bison \
      flex \
      libssl-dev \
      libelf-dev \
      xz-utils \
      zstd \
      git \
      curl \
      wget \
      cpio \
      dwarves \
      python3 \
      python3-pip \
      pahole \
      xmlto \
      docbook-utils \
      gcc \
      make \
      automake \
      autoconf \
      libtool \
      kmod \
      rsync

- name: Download kernel source
  run: |
    # Download Linux 7.1 kernel (latest stable in 7.x series)
    # Note: 7.1 may not exist yet on kernel.org, so we'll try 6.13 or latest
    KERNEL_VERSION="6.13.5"
    
    # Try to download from kernel.org
    wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz || \
    wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz
    
    tar -xf linux-${KERNEL_VERSION}.tar.xz
    mv linux-${KERNEL_VERSION} linux-tkg
    
    echo "KERNEL_VERSION=${KERNEL_VERSION}" >> $GITHUB_ENV

- name: Apply custom patches
  run: |
    cd linux-tkg
    
    # Apply your custom patches from the repository
    PATCH_DIR=${{ github.workspace }}/build-tools/linux-tkg-p03/patches
    
    if [ -d "$PATCH_DIR" ]; then
      for patch in "$PATCH_DIR"/*.patch; do
        if [ -f "$patch" ]; then
          echo "Applying patch: $(basename $patch)"
          patch -p1 < "$patch" || echo "Warning: $(basename $patch) failed to apply"
        fi
      done
    fi
    
    # Copy p03.config if it exists
    if [ -f "${{ github.workspace }}/build-tools/linux-tkg-p03/p03.config" ]; then
      cp ${{ github.workspace }}/build-tools/linux-tkg-p03/p03.config .config
    fi

- name: Configure kernel for ${{ matrix.cpu }}
  run: |
    cd linux-tkg
    
    # Start with a base configuration
    make defconfig
    
    # Apply CPU-specific optimizations
    case "${{ matrix.cpu }}" in
      znver3)
        scripts/config --set-val CONFIG_MZEN_V3 y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        scripts/config --set-val CONFIG_MZEN_V2 n
        scripts/config --set-val CONFIG_MZEN_V4 n
        ;;
      znver4)
        scripts/config --set-val CONFIG_MZEN_V4 y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        scripts/config --set-val CONFIG_MZEN_V2 n
        scripts/config --set-val CONFIG_MZEN_V3 n
        ;;
      x86-64-v3)
        scripts/config --set-val CONFIG_GENERIC_CPU2 y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_MZEN_V2 n
        scripts/config --set-val CONFIG_MZEN_V3 n
        scripts/config --set-val CONFIG_MZEN_V4 n
        ;;
      x86-64-v4)
        scripts/config --set-val CONFIG_GENERIC_CPU3 y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        scripts/config --set-val CONFIG_MZEN_V2 n
        scripts/config --set-val CONFIG_MZEN_V3 n
        scripts/config --set-val CONFIG_MZEN_V4 n
        ;;
      haswell)
        scripts/config --set-val CONFIG_MHASWELL y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        ;;
      skylake)
        scripts/config --set-val CONFIG_MSKYLAKE y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        ;;
      broadwell)
        scripts/config --set-val CONFIG_MBROADWELL y
        scripts/config --set-val CONFIG_GENERIC_CPU n
        scripts/config --set-val CONFIG_MCORE2 n
        scripts/config --set-val CONFIG_MATOM n
        scripts/config --set-val CONFIG_GENERIC_CPU2 n
        ;;
    esac
    
    # Enable TKG-like optimizations
    scripts/config --enable CONFIG_HZ_1000
    scripts/config --set-val CONFIG_HZ 1000
    scripts/config --enable CONFIG_SCHED_ALT
    scripts/config --enable CONFIG_BORE_SCHEDULER
    scripts/config --enable CONFIG_TCP_CONG_BBR
    scripts/config --enable CONFIG_NET_SCH_FQ
    scripts/config --enable CONFIG_NET_SCH_FQ_CODEL
    scripts/config --enable CONFIG_NET_SCH_CAKE
    scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
    scripts/config --enable CONFIG_BPFILTER
    scripts/config --enable CONFIG_BPF_SYSCALL
    scripts/config --enable CONFIG_CGROUP_BPF
    
    # Save configuration
    make olddefconfig
    
    echo "Configuration for ${{ matrix.cpu }}:"
    grep "CONFIG_MZEN_V[234]\|CONFIG_GENERIC_CPU\|CONFIG_MHASWELL\|CONFIG_MSKYLAKE\|CONFIG_MBROADWELL" .config

- name: Build kernel
  run: |
    cd linux-tkg
    
    # Build kernel
    make -j$(nproc) bzImage
    make -j$(nproc) modules
    
    echo "Kernel build completed for ${{ matrix.cpu }}"

- name: Package kernel
  run: |
    cd linux-tkg
    
    # Create package directory
    mkdir -p kernel-package/boot
    mkdir -p kernel-package/lib/modules
    
    # Copy kernel image
    cp arch/x86/boot/bzImage kernel-package/boot/vmlinuz-tkg-${{ matrix.cpu }}
    
    # Install modules
    make modules_install INSTALL_MOD_PATH=kernel-package
    
    # Create package
    cd kernel-package
    tar -czf ../linux-tkg-${{ matrix.cpu }}.tar.gz *
    
    # Also create zst package for Arch compatibility
    tar -cf ../linux-tkg-${{ matrix.cpu }}.tar *
    zstd ../linux-tkg-${{ matrix.cpu }}.tar -o ../linux-tkg-${{ matrix.cpu }}.tar.zst
    
    cd ..

- name: Upload kernel artifacts
  uses: actions/upload-artifact@v4
  with:
    name: linux-tkg-${{ matrix.cpu }}
    path: |
      linux-tkg/linux-tkg-${{ matrix.cpu }}.tar.gz
      linux-tkg/linux-tkg-${{ matrix.cpu }}.tar.zst
      linux-tkg/arch/x86/boot/bzImage
    retention-days: 7
    if-no-files-found: warn

name: Linux Kernel P03 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false
    
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          xz-utils \
          zstd \
          cpio \
          dwarves \
          pahole \
          kmod \
          rsync \
          git \
          wget \
          curl
    
    - name: Debug - Show customization.cfg contents
      run: |
        echo "=== Checking for customization.cfg ==="
        find . -name "customization.cfg" -type f 2>/dev/null
        echo "=== Contents of customization.cfg ==="
        cat build-tools/linux-tkg-p03/customization.cfg 2>/dev/null || echo "File not found at expected path"
        
        # Also check if it's in a different location
        find . -name "*.cfg" -type f 2>/dev/null | head -20
    
    - name: Get kernel version from config
      id: kernel_version
      run: |
        # Try multiple ways to extract version
        VERSION=""
        CONFIG_FILE="build-tools/linux-tkg-p03/customization.cfg"
        
        # Check if config file exists
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "ERROR: Configuration file not found!"
          echo "version=7.1" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Method 1: Look for _version= variable (typical in TKG configs)
        VERSION=$(grep -E '^_version=' "$CONFIG_FILE" | sed 's/_version=//' | tr -d '"' | tr -d "'" | head -1)
        
        # Method 2: Look for VERSION= variable
        if [ -z "$VERSION" ]; then
          VERSION=$(grep -E '^VERSION=' "$CONFIG_FILE" | sed 's/VERSION=//' | tr -d '"' | tr -d "'" | head -1)
        fi
        
        # Method 3: Look for kernel version pattern (7.x or 6.x)
        if [ -z "$VERSION" ]; then
          VERSION=$(grep -oP '\d+\.\d+(\.\d+)?' "$CONFIG_FILE" | head -1)
        fi
        
        # Method 4: Look for any line containing version
        if [ -z "$VERSION" ]; then
          VERSION=$(grep -i 'version' "$CONFIG_FILE" | grep -oP '\d+\.\d+(\.\d+)?' | head -1)
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected kernel version: $VERSION"
        
        # Fallback to a default version if empty
        if [ -z "$VERSION" ]; then
          echo "WARNING: Could not detect kernel version, using default 7.1"
          echo "version=7.1" >> $GITHUB_OUTPUT
        fi
    
    - name: Download kernel source
      run: |
        KERNEL_VERSION="${{ steps.kernel_version.outputs.version }}"
        echo "Downloading kernel version: $KERNEL_VERSION"
        
        # Extract major version for URL path
        MAJOR_VERSION=$(echo "$KERNEL_VERSION" | cut -d'.' -f1)
        echo "Major version: $MAJOR_VERSION"
        
        # Try to download the exact version
        DOWNLOAD_SUCCESS=false
        
        # Try v7.x format (current)
        if [ "$MAJOR_VERSION" -ge 7 ]; then
          echo "Trying v7.x kernel download..."
          if wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.tar.xz"; then
            DOWNLOAD_SUCCESS=true
          fi
        fi
        
        # Try v6.x format if v7.x fails
        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "Trying v6.x kernel download..."
          if wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"; then
            DOWNLOAD_SUCCESS=true
          fi
        fi
        
        # Try with .0 appended (e.g., 7.1 -> 7.1.0)
        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "Trying with .0 appended..."
          if wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KERNEL_VERSION}.0.tar.xz"; then
            KERNEL_VERSION="${KERNEL_VERSION}.0"
            DOWNLOAD_SUCCESS=true
          fi
        fi
        
        # Try latest stable kernel if specific version fails
        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "Trying to get latest stable kernel..."
          LATEST=$(curl -s https://www.kernel.org/releases.json | grep -oP '"latest_stable":\s*"\K[^"]+')
          if [ -n "$LATEST" ]; then
            echo "Latest stable kernel: $LATEST"
            MAJOR_VERSION=$(echo "$LATEST" | cut -d'.' -f1)
            if [ "$MAJOR_VERSION" -ge 7 ]; then
              if wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${LATEST}.tar.xz"; then
                KERNEL_VERSION="$LATEST"
                DOWNLOAD_SUCCESS=true
              fi
            fi
          fi
        fi
        
        if [ "$DOWNLOAD_SUCCESS" = false ]; then
          echo "ERROR: Failed to download kernel source for version $KERNEL_VERSION"
          echo "Available versions can be found at: https://www.kernel.org/"
          exit 1
        fi
        
        echo "Successfully downloaded linux-${KERNEL_VERSION}.tar.xz"
        tar -xf "linux-${KERNEL_VERSION}.tar.xz"
        mv "linux-${KERNEL_VERSION}" linux-tkg
    
    - name: Apply patches from repository
      run: |
        cd linux-tkg
        
        # Apply all patches from the patches directory
        PATCH_DIR="${{ github.workspace }}/build-tools/linux-tkg-p03/patches"
        if [ -d "$PATCH_DIR" ]; then
          # Sort patches to apply them in order
          patch_count=0
          for patch in $(ls "$PATCH_DIR"/*.patch 2>/dev/null | sort); do
            if [ -f "$patch" ]; then
              echo "Applying patch: $(basename $patch)"
              if patch -p1 < "$patch"; then
                patch_count=$((patch_count + 1))
              else
                echo "Warning: $(basename $patch) failed to apply"
              fi
            fi
          done
          echo "Applied $patch_count patches successfully"
        else
          echo "No patches directory found at $PATCH_DIR"
          echo "Creating empty patches directory"
          mkdir -p "$PATCH_DIR"
        fi

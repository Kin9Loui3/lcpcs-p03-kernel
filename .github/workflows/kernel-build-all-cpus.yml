name: Linux LCPCs P03 Build All CPUs

on:
  push:
    paths:
      - 'build-tools/linux-tkg-p03/**'
  workflow_dispatch:
    inputs:
      cpu_types:
        description: 'CPU types to build'
        required: false
        default: 'generic native zen zen2 zen3 zen4'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [generic, native, zen, zen2, zen3, zen4]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libssl-dev \
            libelf-dev \
            bc \
            flex \
            bison \
            clang-18 \
            lld-18 \
            llvm-18 \
            llvm-18-dev \
            pahole \
            cpio \
            kmod \
            dwarves

      - name: Clone/update linux-tkg
        run: |
          cd build-tools
          if [ ! -d linux-tkg ]; then
            git clone https://github.com/Frogging-Family/linux-tkg.git
          else
            cd linux-tkg && git pull origin master && cd ..
          fi

      - name: Configure for ${{ matrix.cpu }}
        run: |
          cd build-tools/linux-tkg-p03
          # Update CPU scheduling in customization.cfg
          sed -i 's/^_cpusched=.*/_cpusched=${{ matrix.cpu }}/g' customization.cfg
          echo "=== CPU Config for ${{ matrix.cpu }} ==="
          grep _cpusched customization.cfg

      - name: Stage p03 customization & patches
        run: |
          cd build-tools/linux-tkg-p03
          TKG="../linux-tkg"
          
          # Copy customization
          cp customization.cfg "$TKG/customization.cfg"
          
          # Stage patches as .mypatch (linux-tkg auto-applies them)
          mkdir -p "$TKG/mypatches"
          for p in patches/*.patch; do
            [ -f "$p" ] && cp "$p" "$TKG/$(basename "${p%.patch}").mypatch"
          done
          
          echo "✓ Staged $(ls "$TKG"/*.mypatch 2>/dev/null | wc -l) patches"
          echo "✓ Config ready"

      - name: Build TKG P03 for ${{ matrix.cpu }}
        run: |
          cd build-tools/linux-tkg
          
          # Set compiler to clang-18
          export CC=clang-18
          export CXX=clang++-18
          export LD=lld-18
          export LLVM=1
          export LLVM_IAS=1
          export _NUKR=true
          
          echo "Building with Clang/LLVM + ThinLTO..."
          
          # Use makepkg if PKGBUILD exists, otherwise manual build
          if [ -f PKGBUILD ]; then
            makepkg -s --noconfirm --skippgpcheck 2>&1 | tee build.log
          else
            echo "No PKGBUILD found, using manual build approach"
            make -j$(nproc) \
              ARCH=x86_64 \
              CROSS_COMPILE= \
              all modules 2>&1 | tee build.log
          fi

      - name: Package for Arch
        run: |
          cd build-tools/linux-tkg
          
          # If makepkg already created packages, we're done
          if ls linux-tkg-p03*.pkg.tar.zst 1> /dev/null 2>&1; then
            echo "✓ Packages already created by makepkg"
            ls -lh linux-tkg-p03*.pkg.tar.zst
          else
            echo "Creating Arch packages manually..."
            
            # Create package directories
            mkdir -p pkg/boot pkg/usr/lib/modules
            
            # Install kernel
            mkdir -p pkg/boot
            cp arch/x86_64/boot/bzImage pkg/boot/vmlinuz-linux-tkg-p03-${{ matrix.cpu }}
            cp System.map pkg/boot/System.map-linux-tkg-p03-${{ matrix.cpu }}
            cp .config pkg/boot/config-linux-tkg-p03-${{ matrix.cpu }}
            
            # Install modules
            make modules_install \
              INSTALL_MOD_PATH=pkg \
              ARCH=x86_64
            
            # Create tar package
            cd pkg
            tar -czf ../linux-tkg-p03-${{ matrix.cpu }}-x86_64.pkg.tar.gz *
            cd ..
            
            ls -lh linux-tkg-p03*.pkg.tar.*
          fi

      - name: Verify output packages
        run: |
          cd build-tools/linux-tkg
          if ls linux-tkg-p03*.pkg.tar.* 1> /dev/null 2>&1; then
            echo "✓ Build successful"
            ls -lh linux-tkg-p03*.pkg.tar.*
          else
            echo "✗ No packages found!"
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd build-tools/linux-tkg
          sha256sum linux-tkg-p03*.pkg.tar.* > /tmp/p03-${{ matrix.cpu }}.sha256
          cat /tmp/p03-$

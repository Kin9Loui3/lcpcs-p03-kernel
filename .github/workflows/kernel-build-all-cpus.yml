name: Linux TKG P03 Build All CPUs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

env:
  KERNEL_VERSION: "6.13.5"
  TKG_REPO: "sirlucjan/kernel-patches"
  TKG_REF: "master"

jobs:
  build:
    strategy:
      matrix:
        cpu: [znver3, znver4, x86-64, x86-64-v3, x86-64-v4, haswell, skylake, broadwell]
      max-parallel: 4
      fail-fast: false

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    # Step 1: Checkout YOUR repo (contains your patches and this workflow)
    - name: Checkout your repo with patches
      uses: actions/checkout@v4
      with:
        path: my-repo

    # Step 2: Checkout TKG builder repo
    - name: Checkout TKG builder repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.TKG_REPO }}
        ref: ${{ env.TKG_REF }}
        path: builder

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          xz-utils \
          zstd \
          git \
          curl \
          wget \
          cpio \
          dwarves \
          python3 \
          python3-pip \
          pahole \
          xmlto \
          docbook-utils \
          gcc \
          make \
          automake \
          autoconf \
          libtool \
          kmod

    - name: Download kernel source
      run: |
        cd builder
        wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${{ env.KERNEL_VERSION }}.tar.xz
        tar -xf linux-${{ env.KERNEL_VERSION }}.tar.xz
        mv linux-${{ env.KERNEL_VERSION }} linux-tkg

    - name: Apply YOUR patches
      run: |
        PATCH_DIR="${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/patches"
        echo "Patch directory: $PATCH_DIR"
        echo "Available patches:"
        ls -la "$PATCH_DIR"
        
        cd builder/linux-tkg
        
        # Apply all patches in alphabetical order
        for patch in "$PATCH_DIR"/*.patch; do
          if [ -f "$patch" ]; then
            echo "Applying patch: $(basename $patch)"
            patch -p1 < "$patch" || echo "Warning: Failed to apply $(basename $patch)"
          fi
        done
        
        # Also copy customization.cfg if it exists
        if [ -f "${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/customization.cfg" ]; then
          echo "Copying customization.cfg"
          cp "${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/customization.cfg" .
        fi

    - name: Configure build for CPU optimization
      run: |
        cd builder/linux-tkg
        # Override or set CPU-specific configuration
        cat >> customization.cfg << EOF
        
        # CPU-specific override
        _processor_opt=${{ matrix.cpu }}
        _config_processor_override=1
        _kernelname="-tkg-${{ matrix.cpu }}"
        EOF
        
        echo "Final customization.cfg:"
        cat customization.cfg

    - name: Build kernel
      run: |
        cd builder
        if [ -f "install.sh" ]; then
          chmod +x install.sh
          ./install.sh install
        else
          cd linux-tkg
          make olddefconfig
          make -j$(nproc)
          make modules_install
          make install
        fi

    - name: Upload kernel packages
      uses: actions/upload-artifact@v4
      with:
        name: kernel-packages-${{ matrix.cpu }}
        path: |
          builder/linux-tkg/*.pkg.tar.zst
          builder/linux-tkg/arch/x86/boot/bzImage
          builder/linux-tkg/vmlinux
        retention-days: 7
        if-no-files-found: warn

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
        name: "Linux TKG ${{ env.KERNEL_VERSION }} Kernel Build ${{ github.run_number }}"
        body: |
          ## Linux TKG Kernel ${{ env.KERNEL_VERSION }}
          Auto-built with custom P03 patches
          
          ### CPU Optimizations:
          - znver3 (AMD Zen 3)
          - znver4 (AMD Zen 4)
          - x86-64 (Generic)
          - x86-64-v3 (Haswell/Broadwell/Skylake)
          - x86-64-v4 (AVX512)
          - haswell (Intel Haswell)
          - skylake (Intel Skylake)
          - broadwell (Intel Broadwell)
          
          ### Patches Applied:
          - 750hz, acpi-call, IBT support
          - BBR3, BORE scheduler
          - cgroup-vram, clang-polly
          - Various fixes and optimizations
          - OpenRGB, vhba support
          
          ### Build Info:
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

  update-version:
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Save version
      run: |
        echo "${{ env.KERNEL_VERSION }}" > .last_kernel_version
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add .last_kernel_version
        git commit -m "Update last kernel version to ${{ env.KERNEL_VERSION }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.KERNEL_TOKEN }}

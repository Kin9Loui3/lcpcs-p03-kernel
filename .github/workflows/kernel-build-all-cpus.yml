runs-on: ubuntu-latest
timeout-minutes: 180

steps:
# Step 1: Checkout YOUR repo (contains your patches and this workflow)
- name: Checkout your repo with patches
  uses: actions/checkout@v4
  with:
    path: my-repo

# Step 2: Checkout TKG patches repo
- name: Checkout TKG patches repo
  uses: actions/checkout@v4
  with:
    repository: ${{ env.TKG_REPO }}
    ref: ${{ env.TKG_REF }}
    path: builder

- name: Install dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      build-essential \
      bc \
      bison \
      flex \
      libssl-dev \
      libelf-dev \
      xz-utils \
      zstd \
      git \
      curl \
      wget \
      cpio \
      dwarves \
      python3 \
      python3-pip \
      pahole \
      xmlto \
      docbook-utils \
      gcc \
      make \
      automake \
      autoconf \
      libtool \
      kmod

- name: Extract kernel version from customization.cfg
  id: kernel_version
  run: |
    # Read the version from customization.cfg
    VERSION=$(grep '_version=' ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/customization.cfg | head -1 | cut -d'"' -f2)
    echo "Kernel version from config: $VERSION"
    
    # Map version to directory (handle "latest" suffix)
    if [[ "$VERSION" == *"-latest" ]]; then
      BASE_VERSION=$(echo "$VERSION" | sed 's/-latest//')
      echo "Base version: $BASE_VERSION"
      
      # Check which exact version directory exists
      if [ -d "builder/$BASE_VERSION" ]; then
        echo "version_dir=$BASE_VERSION" >> $GITHUB_OUTPUT
      else
        # Try to find the best match
        for dir in $(ls -d builder/*/ 2>/dev/null | sort -V); do
          dirname=$(basename "$dir")
          if [[ "$dirname" == "$BASE_VERSION"* ]]; then
            echo "version_dir=$dirname" >> $GITHUB_OUTPUT
            break
          fi
        done
      fi
    else
      echo "version_dir=$VERSION" >> $GITHUB_OUTPUT
    fi
    
    echo "version=$VERSION" >> $GITHUB_OUTPUT

- name: Setup kernel source with patches
  run: |
    VERSION_DIR="${{ steps.kernel_version.outputs.version_dir }}"
    echo "Using version directory: $VERSION_DIR"
    
    cd builder/$VERSION_DIR
    
    # Read the kernel version from the config file in this directory
    KERNEL_VERSION=$(grep 'KERNEL_VERSION=' linux-tkg-config/prepare | head -1 | cut -d'"' -f2)
    echo "Kernel version to download: $KERNEL_VERSION"
    
    # Download kernel source
    wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KERNEL_VERSION.tar.xz || \
    wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-$KERNEL_VERSION.tar.xz
    
    tar -xf linux-$KERNEL_VERSION.tar.xz
    mv linux-$KERNEL_VERSION linux-tkg
    
    # Copy your customization.cfg
    cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/customization.cfg customization.cfg
    
    # Copy your patches to the patches directory
    mkdir -p patches/custom
    cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/patches/*.patch patches/custom/
    
    # Copy p03.config if it exists
    if [ -f "${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/p03.config" ]; then
      cp ${{ github.workspace }}/my-repo/build-tools/linux-tkg-p03/p03.config .
    fi
    
    # Add CPU-specific configuration
    cat >> customization.cfg << EOF
    
    # CPU-specific override
    _processor_opt=${{ matrix.cpu }}
    _config_processor_override=1
    _kernelname="-tkg-${{ matrix.cpu }}"
    EOF
    
    echo "Final customization.cfg:"
    cat customization.cfg
    
    echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV

- name: Run TKG build
  run: |
    VERSION_DIR="${{ steps.kernel_version.outputs.version_dir }}"
    cd builder/$VERSION_DIR
    
    # Make sure we're in the right directory
    echo "Building in: $(pwd)"
    echo "Contents:"
    ls -la
    
    # Run the TKG build script
    if [ -f "linux-tkg-config/prepare" ]; then
      echo "Running prepare script..."
      bash linux-tkg-config/prepare
    fi
    
    # Enter the kernel source directory and build
    cd linux-tkg
    
    # Apply patches manually if needed
    echo "Applying patches..."
    for patch in ../patches/custom/*.patch; do
      if [ -f "$patch" ]; then
        echo "Applying: $(basename $patch)"
        patch -p1 < "$patch" || echo "Warning: $(basename $patch) failed"
      fi
    done
    
    # Configure with TKG config
    if [ -f "../linux-tkg-config/config" ]; then
      cp ../linux-tkg-config/config .config
    fi
    
    # Build
    make olddefconfig
    make -j$(nproc)

- name: Install kernel modules
  run: |
    VERSION_DIR="${{ steps.kernel_version.outputs.version_dir }}"
    cd builder/$VERSION_DIR/linux-tkg
    make modules_install
    make install

- name: Upload kernel packages
  uses: actions/upload-artifact@v4
  with:
    name: kernel-packages-${{ matrix.cpu }}
    path: |
      builder/${{ steps.kernel_version.outputs.version_dir }}/linux-tkg/*.pkg.tar.zst
      builder/${{ steps.kernel_version.outputs.version_dir }}/linux-tkg/arch/x86/boot/bzImage
      builder/${{ steps.kernel_version.outputs.version_dir }}/linux-tkg/vmlinux
    retention-days: 7
    if-no-files-found: warn
